[package]
name = "raspdac-display"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "raspdac-display"
path = "bin/raspdac_display.rs"

[[bin]]
name = "check-oled"
path = "bin/check_oled.rs"

[[bin]]
name = "charge-system-simu"
path = "bin/charge_system_simu.rs"

[dependencies]
charge_system_common = { package = "charge-system-common-model",  git = "https://github.com/fengalin/ocpp-server", branch = "webserver-wasm"  }
chrono = "0.4.45"
mpd_client = { git = "https://github.com/fengalin/mpd_client", branch = "update-dependencies" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
rpi-pal = "0.22"
serde = { version = "^1", features = ["derive", "alloc"] }
serde_json = "^1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "macros", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release-slim]
inherits = "release"
strip = "symbols"
opt-level = "s"
lto = "fat"
panic = "abort"
codegen-units = 1
